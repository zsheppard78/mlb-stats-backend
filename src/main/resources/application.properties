spring.application.name=BaseballStats
server.port=${PORT:8080}

# Database
# On Render, DATABASE_URL (from Neon) is picked up by config/DatabaseConfig.java.
# Without it, the app uses a temporary in-memory H2 database.
# Flyway creates the tables from src/main/resources/db/migration; Hibernate only checks them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
