spring.application.name=statdugout-api
server.port=${PORT:8080}

# Database
# On Render, DATABASE_URL (from Neon) is picked up by config/DatabaseConfig.java.
# Without it, the app uses a temporary in-memory H2 database, so it runs with no setup.
# Flyway creates and updates the tables from src/main/resources/db/migration.
spring.flyway.enabled=true

# Google sign-in: set GOOGLE_CLIENT_ID on Render (see README). Without it, only username sign-in is offered.
